<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
<title id="title">Emberline Motors — PARTS COUNTER</title>
<desc id="desc">A dark ember-toned Emberline Motors parts counter graphic.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#181b1d"/><stop offset=".58" stop-color="#0b0d0e"/><stop offset="1" stop-color="#24120d"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#c9672d" stop-opacity=".42"/><stop offset="1" stop-color="#c9672d" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="900" height="1200" fill="url(#bg)"/>
<rect width="900" height="1200" fill="url(#grid)"/>
<circle cx="450" cy="480" r="390" fill="url(#glow)"/>
<path d="M70 82h760M70 1118h760" stroke="#c9672d" stroke-width="4"/>
<text x="450" y="150" text-anchor="middle" fill="#c9672d" font-family="Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="10">EMBERLINE</text>
<text x="450" y="205" text-anchor="middle" fill="#f2eee5" font-family="Georgia,serif" font-size="68" font-weight="700" letter-spacing="4">MOTORS</text>
<g transform="translate(450 455)" fill="none" stroke="#f0d4b5" stroke-width="20"><circle r="128"/><circle r="44"/><path d="M0-128V-194M0 128V194M-128 0H-194M128 0H194M-91-91l-47-47M91 91l47 47M91-91l47-47M-91 91l-47 47"/></g>
<text x="450" y="870" text-anchor="middle" fill="#f2eee5" font-family="Arial,sans-serif" font-size="42" font-weight="700" letter-spacing="5">PARTS COUNTER</text>
<text x="450" y="930" text-anchor="middle" fill="#c9b9a9" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">PANELS  •  WHEELS  •  KEYS</text>
<path d="M220 992h460" stroke="#c9672d" stroke-width="3"/>
<text x="450" y="1050" text-anchor="middle" fill="#8e8b85" font-family="Arial,sans-serif" font-size="18" letter-spacing="6">CHERNARUS</text>
