  <style>
    .nasdara-page{--nasdara-accent:#C69A52;--nasdara-hover:#E1BC78;--nasdara-bronze:#87633D;--nasdara-deep:#1d1812}
    .nasdara-page .back{color:var(--nasdara-hover)}
    .nasdara-page .kicker,.nasdara-page .project-label{color:var(--nasdara-accent)}
    .nasdara-page .world-tag{border-color:var(--nasdara-bronze);background:var(--nasdara-deep);color:var(--nasdara-hover)}
    .nasdara-page .server-info{border-color:var(--nasdara-bronze);background:linear-gradient(120deg,#1b1815,#141515)}
    .nasdara-page .server-info h2{color:#f0ece5}
    .nasdara-page .server-info p{max-width:620px}
    .nasdara-page .server-endpoint span{border-color:var(--nasdara-bronze);background:#111416;color:#d8c4ad}
    .nasdara-page .server-info .copy-server{border-color:var(--nasdara-bronze);background:var(--nasdara-deep);color:var(--nasdara-hover)}
    .nasdara-page .server-info .copy-server:hover{border-color:var(--nasdara-hover)!important;background:#2a2117!important;color:var(--nasdara-hover)!important;box-shadow:0 4px 14px rgba(198,154,82,.2)}
    .nasdara-page .project-grid{padding-top:0}
    .nasdara-page .project-card{border-color:rgba(135,99,61,.78);background:linear-gradient(150deg,#1b1815,#101112)}
    .nasdara-page .project-card:after{background:radial-gradient(circle,rgba(198,154,82,.13),transparent 65%)}
    .nasdara-page .project-card h2{color:#f0ece5}
    .nasdara-page .project-card .button{border-color:var(--nasdara-bronze);background:#1d1812;color:var(--nasdara-hover)}
    .nasdara-page .project-card .button:hover{border-color:var(--nasdara-hover)!important;background:#2a2117!important;color:var(--nasdara-hover)!important;box-shadow:0 4px 14px rgba(198,154,82,.2)}
    .nasdara-page .nasdara-status{border-color:var(--nasdara-bronze);background:#1d1812;color:var(--nasdara-hover);cursor:default}
    .nasdara-page .nasdara-status:before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;border-radius:50%;background:var(--nasdara-accent);vertical-align:middle}
    .nasdara-page .nasdara-community{margin:0 0 76px}
    .nasdara-page .nasdara-community h2{margin:6px 0;font-size:1.45rem;text-transform:uppercase}
    .nasdara-page .nasdara-community p{margin:0;color:var(--muted);line-height:1.6}
    .nasdara-page .nasdara-community .button{border-color:var(--nasdara-bronze);background:#1d1812;color:var(--nasdara-hover)}
    .nasdara-page .nasdara-community .button:hover{border-color:var(--nasdara-hover)!important;background:#2a2117!important;color:var(--nasdara-hover)!important;box-shadow:0 4px 14px rgba(198,154,82,.2)}
    .nasdara-page .launcher-select{border-color:var(--nasdara-bronze);background:var(--nasdara-deep);color:var(--nasdara-hover)}
    .nasdara-page .launcher-select:hover{border-color:var(--nasdara-hover)!important;background:#2a2117!important;color:var(--nasdara-hover)!important}
    .nasdara-page .launcher-select:focus{outline-color:var(--nasdara-hover)}
    @media(min-width:761px) and (max-width:1100px){
      .nasdara-page .server-info[data-server-ip]{grid-template-columns:1fr auto auto}
      .nasdara-page .server-info[data-server-ip]>div:first-child{grid-column:1/-1}
    }
    @media(max-width:760px){
      .nasdara-page .server-endpoint span{white-space:normal;overflow-wrap:anywhere}
      .nasdara-page .nasdara-community{margin-bottom:54px}
    }
  </style>
</head>
