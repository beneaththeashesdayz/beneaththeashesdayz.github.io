# Refresh trigger after approved attachment trader config update
name: Sync GTX Market

on:
  workflow_dispatch:
  push:
    paths:
      - "sync_gtx_market.py"
      - "build_live_trader_catalogues.py"
      - "build_linda_catalogue.py"
      - "build_quinn_catalogue.py"
      - "build_indar_catalogue.py"
      - "polish_quinn_names.py"
      - "polish_quinn_acronyms.py"
      - "polish_attachment_names.py"
      - "activate_attachment_trader.py"
      - ".github/workflows/sync-gtx-market.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-gtx-market
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SFTP dependency
        run: python -m pip install --disable-pip-version-check paramiko

      - name: Download live GTX market data
        env:
          GTX_HOST: ${{ secrets.GTX_HOST }}
          GTX_PORT: ${{ secrets.GTX_PORT }}
          GTX_USERNAME: ${{ secrets.GTX_USERNAME }}
          GTX_PASSWORD: ${{ secrets.GTX_PASSWORD }}
          GTX_MARKET_PATH: profiles/ExpansionMod/Market
          GTX_TRADERS_PATH: profiles/ExpansionMod/Traders
          GTX_TRADERZONES_PATH: mpmissions/dayzOffline.chernarusplus/expansion/traderzones
          GTX_MARKET_SETTINGS_PATH: mpmissions/dayzOffline.chernarusplus/expansion/settings/MarketSettings.json
        run: python sync_gtx_market.py

      - name: Build live trader catalogues
        run: python build_live_trader_catalogues.py

      - name: Build Linda medical catalogue
        run: python build_linda_catalogue.py

      - name: Build Quinn clothing catalogue
        run: python build_quinn_catalogue.py

      - name: Build Indar weapons catalogue
        run: python build_indar_catalogue.py

      - name: Polish Quinn clothing display names
        run: python polish_quinn_names.py

      - name: Polish Quinn acronyms and compact names
        run: python polish_quinn_acronyms.py

      - name: Polish attachment trader display names
        run: python polish_attachment_names.py

      - name: Activate attachment trader directory card
        run: python activate_attachment_trader.py

      - name: Commit market and catalogue changes
        shell: bash
        run: |
          git add data/live-market \
            chernarus/traders/index.html \
            chernarus/traders/naomi/catalogue-data.js \
            chernarus/traders/rolf/catalogue-data.js \
            chernarus/traders/linda/catalogue-data.js \
            chernarus/traders/quinn/catalogue-data.js \
            chernarus/traders/indar/catalogue-data.js \
            chernarus/traders/attachment-trader/catalogue-data.js

          if git diff --cached --quiet; then
            echo "No market or catalogue changes detected."
            exit 0
          fi

          git config user.name "Beneath the Ashes Market Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync live GTX market and trader catalogues"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
