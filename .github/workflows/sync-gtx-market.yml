name: Sync GTX Market

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-gtx-market
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SFTP dependency
        run: python -m pip install --disable-pip-version-check paramiko

      - name: Download live GTX market data
        env:
          GTX_HOST: ${{ secrets.GTX_HOST }}
          GTX_PORT: ${{ secrets.GTX_PORT }}
          GTX_USERNAME: ${{ secrets.GTX_USERNAME }}
          GTX_PASSWORD: ${{ secrets.GTX_PASSWORD }}
          GTX_MARKET_PATH: profiles/ExpansionMod/Market
          GTX_TRADERZONES_PATH: mpmissions/dayzOffline.chernarusplus/expansion/traderzones
        run: python sync_gtx_market.py

      - name: Commit market changes
        shell: bash
        run: |
          if git diff --quiet -- data/live-market; then
            echo "No market changes detected."
            exit 0
          fi

          git config user.name "Beneath the Ashes Market Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live-market
          git commit -m "Sync live GTX market data"
          git push
