    <div class="lore-eyebrow">The Chernarus Archive</div>
    <h3>The world ended. The people did not.</h3>
    <p>Nobody agrees on exactly how it started. Some blame the virus. Others blame the experiments. The old survivors whisper about government bunkers, buried laboratories and cargo ships that should have never made landfall. Whatever the truth was, the end came hard. The military fought back, then the military disappeared. Aircraft fell from the sky. Ships drifted empty along the coast. Entire towns vanished beneath smoke, silence and the first long shadow of the Ashfall.</p>
    <p>For years, Chernarus sat abandoned beneath endless storms and the footsteps of the dead. The fires never truly went out. Deep below the ruined world, factories hummed, generators churned and secret facilities remained powered long after their creators stopped answering. Somewhere in that darkness, old systems continued waiting for instructions—or for someone to trespass.</p>
    <p>Then survivors began coming back. They came along broken roads, out of the tree line and in from the coast, carrying what they could save and learning which places were better left alone. A homestead became a wall, a roof, a garden and a promise. A workshop turned scrap into tools. A repaired boat opened a route to the next settlement. Survival was still dangerous, but it was no longer only about making it through the night.</p>
    <p>Along the coast, sailors reclaimed abandoned vessels and rebuilt the <strong>Rustwake Marina</strong>. Cargo boats and fishing craft began moving again, carrying supplies through waters that still kept more secrets than they gave up. Inland, smugglers, scavengers and mercenaries gathered their routes into the <strong>Cinder Market</strong>, where weapons, technology, contraband and artifacts changed hands for the right price.</p>
    <p>Whenever Lewis of <strong>The Deep Vein</strong> appeared, miners followed with sacks of ore, gemstones and precious metals. Some said Lewis had worked the mines before the collapse. Others swore he carried maps to deposits no one else had found. He never confirmed either story. He weighed the earth, paid what he thought it was worth and moved on, leaving another settlement with the means to repair, build or trade.</p>
    <p>Cash became the language that connected those settlements. <strong>Zombie Notes</strong> became valuable too, though no official explanation for them survived. They turn up in the hands of infected and in the pockets of armed patrols, and nobody can say with certainty who first issued them or why. Their origin remains a question. Their usefulness does not.</p>

    <h3 class="story-chapter">What the ruins kept running</h3>
    <p>As the communities grew, scavengers started finding evidence that the old world had not gone completely quiet. The classified <strong>Ember Research Institute</strong> had operated beneath the military installations of Chernarus, officially nowhere and unofficially everywhere that Project Remnant required. Its scientists pursued experimental treatments and biological adaptation inside concealed laboratories, checkpoints and fortified containment sites.</p>
    <p>Then the Institute went dark. Communications ceased. Emergency lockdowns closed the facilities. The evacuation record was never found, and the transmissions that remain end without an answer. Some personnel are presumed lost. Other traces suggest that part of the organization may have survived, or that someone else learned how to use what it left behind. No single account explains who still has a hand on the controls.</p>
    <p>The coloured <strong>SAFESTORE</strong> buildings offered the first clear sign that the Institute’s network was larger than a few buried laboratories. They were distributed supply depots, placed where civilian survival, field operations and specialized research work could each draw from the system’s stores. Their different clearance levels were meant to keep the right supplies moving to the right hands.</p>
    <p>Now the depots stand among ordinary roads and settlements, their doors still recognizing the logic of a vanished organization. A coloured building can look like another ruin until the right credential wakes the lock. Then the old supply chain reveals itself, and the survivor standing at the door becomes exactly what the system was built to detect: an intruder.</p>
    <p>The credentials are not simply waiting in perfect condition for someone to find them. Scavengers recover packaged chips, blank card bodies and electronic components, then assemble workbenches and reconstruct access from fragments that were never meant to be separated. Every working card is part salvage, part patience and part argument with a machine that still remembers the old rules.</p>

    <h3 class="story-chapter">Doors beyond the depots</h3>
    <p>The Red SAFESTORE is not the end of that trail. A Red DNA card opens the Red depot, where recovered credentials may point toward separate restricted research facilities. A credential found there is tied to the door it names, not to every locked place beyond it, and some searches end without producing one at all.</p>
    <p>Those deeper doors bear the names survivors now know—Fort Greenville, Fort Kamensk, Tower Hill and Fort Tisy—but the places behind them belong to a history that has not finished unfolding. The Ember Command Annex was supposed to coordinate emergency broadcasts, recovery work and supply deployments after the collapse. Whether its signals are old orders repeating themselves or the choices of someone still listening, no surviving record can settle.</p>

    <h3 class="story-chapter">The ones who answer a breach</h3>
    <p>Some breaches do more than open a door. An organized armed force known as the <strong>ATF</strong> responds to security violations and attempts to recover restricted property. Open a DNA crate or unlock a research facility, and reinforcements may arrive hunting the person who crossed the boundary.</p>
    <p>No one has found a reliable record explaining how closely the ATF is connected to the Institute. Their movements suggest orders. Their equipment suggests access. Their response suggests that someone, somewhere, still considers the old network worth protecting. The connection remains buried beneath missing names, sealed rooms and the silence that follows an unanswered transmission.</p>
    <p>The <strong>Ashguard</strong> carries its own name and its own presence through Chernarus. Their use of equipment resembling ATF equipment has fed stories about diverted supplies, shared caches and undisclosed connections. Stories travel faster than proof. For now, Ashguard remains distinct from the ATF, and the space between them is another part of the mystery survivors have learned to live with.</p>

    <h3 class="story-chapter">The work of tomorrow</h3>
    <p>For all the danger beyond the fences, the future of Chernarus is being built in smaller places. People fish, hunt, mine, repair and trade. Workshops turn salvaged parts into useful tools. Homesteads gather food, store water and make room for one more person at the table.</p>
    <p>Food preservation has become one of the clearest signs of that change. A sealed jar or prepared can is not just something to eat later; it is a decision to prepare for the season ahead instead of surviving one meal at a time. The roads, the Marina, the Market and the mines all matter because they connect that work. What one community cannot make, another may grow, salvage, carry or trade.</p>
    <p>The old world left behind dangerous machines, locked facilities and a security network that still considers survivors trespassers. But it also left materials, knowledge and the possibility of connection. Each repaired roof, stocked shelf, rebuilt boat and shared route makes the same quiet statement: Chernarus is not waiting to be restored. It is being rebuilt by the people who stayed.</p>
    <p class="lore-closing"><strong>Trading. Building. Preserving. Exploring. Fighting. Surviving.</strong></p>
    <p>The world ended. Their story did not. Beneath the ashes, hope is no longer a rumor passed between survivors. It is the work of their hands, the light in a workshop window and the home they choose to protect.</p>
    <p class="lore-closing"><strong>Welcome to Beneath the Ashes.</strong></p>

ow">The Truth</div>
<h3>The world ended. Your story did not.</h3>
    <p>The world above may have burned. Civilization may have collapsed. The infected may own the roads. But humanity is not gone.</p>
    <p class="lore-closing"><strong>Trading. Building. Preserving. Exploring. Fighting. Surviving.</strong></p>
    <p>The ashes of the old world cover every city, road and ruined military base. Beneath them, communities are learning how to make food last, how to repair what they find and how to turn dangerous knowledge into another day of shelter.</p>
    <p>The Institute’s doors still hold questions. The ATF still answers some of them with force. The Ashguard, the traders and the settlements all carry pieces of a history no one fully understands.</p>
    <p>What comes next is up to you.</p>
